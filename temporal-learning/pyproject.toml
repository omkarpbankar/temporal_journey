[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-learning"
version = "0.1.0"
description = "Hands-on labs for the Temporal Python learning journey"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.35,<2",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "pytest-timeout>=2", "httpx>=0.27", "moto[s3,sqs,sns,dynamodb,secretsmanager]>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src", "."]
testpaths = ["tests"]
# A hang should be a loud failure, not a silent wait.
timeout = 120
markers = ["integration: needs a real local Temporal server"]
filterwarnings = ["ignore::DeprecationWarning"]
